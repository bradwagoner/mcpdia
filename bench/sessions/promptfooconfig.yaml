# Side-by-side Claude sessions. Run through run.mjs, which sets the step, the
# spending cap and which side runs.
description: MCPedia against markdown memory files
prompts:
  - '{{prompt}}'
providers:
  - id: file://provider.mjs
    label: mcpedia
    config:
      side: mcpedia
  - id: file://provider.mjs
    label: markdown
    config:
      side: markdown
  - id: file://provider.mjs
    label: markdown-onefile
    config:
      side: markdown-onefile
tests: file://tests.mjs
