name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # better-sqlite3 ships prebuilt binaries, but npm still runs node-gyp for its
      # binding.gyp, and Node 22's bundled node-gyp cannot find the runner's Visual
      # Studio on windows-latest. No dependency needs an install script, so skip them.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
